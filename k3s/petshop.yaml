apiVersion: apps/v1
kind: Deployment
metadata:
  name: petshop
  namespace: petshop
  labels:
    app: petshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petshop
  template:
    metadata:
      labels:
        app: petshop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: petshop
          image: samuelaka225/petshop:IMAGE_TAG
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /jpetstore/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /jpetstore/
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: petshop
  namespace: petshop
spec:
  type: NodePort
  selector:
    app: petshop
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
